[project]
name = "redis-tagged-cache"
version = "0.1.0"
description = ""
authors = [{ name = "Fabien MARTY", email = "fabien.marty@botify.com" }]
requires-python = "~=3.9"
readme = "README.md"
dependencies = ["redis>=3.2.0", "wrapt>=1.16.0"]

[dependency-groups]
test = ["pytest>=8.3", "pytest-cov>=6.0", "packaging>= 24.2"]
lint = ["ruff>=0.8", "mypy>=1.13"]
dev = ["pydeps>=3.0.1", "pytest-asyncio>=0.21.2"]
doc = [
    "import-linter>=2.1",
    "mkdocstrings[python]>=0.27",
    "mkdocs-material>=9.5.47",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "jinja-tree>=0.6.1",
]

[tool.uv]
default-groups = ["test", "lint", "dev", "doc"]

[tool.hatch.build.targets.sdist]
include = ["rtc"]

[tool.hatch.build.targets.wheel]
include = ["rtc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
exclude = "^site"

[[tool.mypy.overrides]]
module = ["wrapt.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "rtc/infra/adapters/metadata/bad.py",
    "rtc/infra/adapters/storage/bad.py",
]
